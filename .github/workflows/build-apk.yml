name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub Releases
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # opt-in to Node.js 24 actions

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 21 — AGP 9.x requires JDK 21 minimum
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 3. Override gradle-daemon-jvm.properties to use CI's JDK 21
      #    (the file specifies toolchainVersion=17 via foojay which blocks AGP 9.x)
      - name: Force Gradle daemon to use JDK 21
        run: |
          echo "# Overridden by CI — use setup-java JDK 21 instead of foojay JDK 17" \
            > gradle/gradle-daemon-jvm.properties
          echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
          echo "✅ Gradle will use JDK at: $JAVA_HOME"
          java -version

      # 4. Install Android SDK API 36 + build tools (required by AGP 9.1.1)
      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(find $ANDROID_SDK_ROOT/cmdline-tools -name sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          echo "y" | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          echo "y" | $SDKMANAGER "platforms;android-36" "build-tools;36.0.0"

      # 5. Create local.properties pointing to CI Android SDK
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # 6. Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 7. Inject BASE_URL via Gradle property (safer than sed — no file corruption)
      - name: Build Debug APK
        run: |
          BASE_URL_ARG=""
          if [ -n "${{ secrets.BASE_URL }}" ]; then
            BASE_URL_ARG="-PBASE_URL=${{ secrets.BASE_URL }}"
            echo "✅ BASE_URL: ${{ secrets.BASE_URL }}"
          else
            echo "⚠️  BASE_URL not set, using default from build.gradle"
          fi
          ./gradlew assembleDebug --no-daemon $BASE_URL_ARG

      # 8. Get version name
      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 \
            | sed 's/.*versionName[[:space:]]*"\(.*\)"/\1/' | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      # 9. Rename APK
      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             release/AI-Study-Assistant-v${{ steps.version.outputs.version }}.apk

      # 10. Publish to GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "AI Study Assistant v${{ steps.version.outputs.version }}"
          body: |
            ## 📱 AI Study Assistant — Debug Build

            ### Installation
            1. Télécharger l'APK ci-dessous
            2. Sur Android : **Paramètres → Sécurité → Sources inconnues** → Autoriser
            3. Ouvrir l'APK et installer

            > Built from: ${{ github.sha }}
          files: release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
