name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (matches gradle-daemon-jvm.properties toolchainVersion=17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Diagnostic — print environment info to help debug
      - name: Print environment info
        run: |
          echo "=== Java version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo $JAVA_HOME
          echo "=== ANDROID_SDK_ROOT ==="
          echo $ANDROID_SDK_ROOT
          echo "=== Android SDK platforms ==="
          ls $ANDROID_SDK_ROOT/platforms/ 2>/dev/null || echo "No platforms folder"
          echo "=== Build tools ==="
          ls $ANDROID_SDK_ROOT/build-tools/ 2>/dev/null || echo "No build-tools folder"
          echo "=== cmdline-tools ==="
          find $ANDROID_SDK_ROOT/cmdline-tools -name sdkmanager 2>/dev/null || echo "sdkmanager not found"

      # 4. Install Android SDK API 36 + build tools (required by AGP 9.1.1)
      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(find $ANDROID_SDK_ROOT/cmdline-tools -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "❌ sdkmanager not found at $ANDROID_SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "✅ Using sdkmanager: $SDKMANAGER"
          echo "y" | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          echo "y" | $SDKMANAGER "platforms;android-36" "build-tools;36.0.0"
          echo "=== Installed platforms after install ==="
          ls $ANDROID_SDK_ROOT/platforms/

      # 5. Create local.properties pointing to CI Android SDK
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "✅ local.properties created with sdk.dir=$ANDROID_SDK_ROOT"

      # 6. Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 7. Update BASE_URL with production backend URL (set BASE_URL secret in repo Settings)
      - name: Inject BASE_URL into build.gradle
        run: |
          if [ -n "${{ secrets.BASE_URL }}" ]; then
            sed -i 's|buildConfigField "String", "BASE_URL", ".*"|buildConfigField "String", "BASE_URL", "\"${{ secrets.BASE_URL }}\""|g' app/build.gradle
            echo "✅ BASE_URL set to: ${{ secrets.BASE_URL }}"
          else
            echo "⚠️  BASE_URL secret not set — using default URL from build.gradle"
          fi

      # 8. Build the debug APK — with stacktrace for debugging
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 9. Get version name from build.gradle
      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*versionName[[:space:]]*"\(.*\)"/\1/' | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      # 10. Rename APK to something readable
      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             release/AI-Study-Assistant-v${{ steps.version.outputs.version }}.apk

      # 11. Create GitHub Release and upload APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "AI Study Assistant v${{ steps.version.outputs.version }}"
          body: |
            ## 📱 AI Study Assistant — Debug Build

            ### Installation
            1. Download the APK below
            2. On your Android phone: **Settings → Security → Allow unknown sources** (or "Install unknown apps")
            3. Open the downloaded APK and install

            > ⚠️ This is a debug build (not Play Store signed). Your phone may show a warning — this is normal.

            ### What's new
            - Built from commit: ${{ github.sha }}
            - Build date: ${{ github.event.head_commit.timestamp }}
          files: release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
