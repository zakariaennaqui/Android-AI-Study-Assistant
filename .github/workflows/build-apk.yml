name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (matches your project)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Update BASE_URL with production Render URL
      #    Set BASE_URL secret in: GitHub repo → Settings → Secrets → Actions
      #    Value example: https://ai-study-assistant-backend.onrender.com/
      - name: Inject BASE_URL into build.gradle
        run: |
          if [ -n "${{ secrets.BASE_URL }}" ]; then
            sed -i 's|buildConfigField "String", "BASE_URL", ".*"|buildConfigField "String", "BASE_URL", "\"${{ secrets.BASE_URL }}\""|g' app/build.gradle
            echo "✅ BASE_URL set to: ${{ secrets.BASE_URL }}"
          else
            echo "⚠️  BASE_URL secret not set — using default URL from build.gradle"
          fi

      # 5. Build the debug APK (no keystore needed)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 6. Get version name from build.gradle
      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*versionName[[:space:]]*"\(.*\)"/\1/' | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      # 7. Rename APK to something readable
      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             release/AI-Study-Assistant-v${{ steps.version.outputs.version }}.apk

      # 8. Create GitHub Release and upload APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "AI Study Assistant v${{ steps.version.outputs.version }}"
          body: |
            ## 📱 AI Study Assistant — Debug Build

            ### Installation
            1. Download the APK below
            2. On your Android phone: **Settings → Security → Allow unknown sources** (or "Install unknown apps")
            3. Open the downloaded APK and install

            > ⚠️ This is a debug build (not Play Store signed). Your phone may show a warning — this is normal.

            ### What's new
            - Built from commit: ${{ github.sha }}
            - Build date: ${{ github.event.head_commit.timestamp }}
          files: release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
